name: release

on:
  push:
    tags:
      - 'v*'
    branches:
      - fix/ci-release  # Enable dry-run testing on the fix branch
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (upload artifacts without creating release)'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

jobs:
  # Determine if this is a real release (tag push) or dry-run
  detect-mode:
    runs-on: ubuntu-latest
    outputs:
      is_tag: ${{ steps.check.outputs.is_tag }}
      is_dry_run: ${{ steps.check.outputs.is_dry_run }}
    steps:
      - id: check
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "is_tag=true" >> $GITHUB_OUTPUT
            echo "is_dry_run=false" >> $GITHUB_OUTPUT
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            if [[ "${{ github.event.inputs.dry_run }}" == "true" ]]; then
              echo "is_tag=false" >> $GITHUB_OUTPUT
              echo "is_dry_run=true" >> $GITHUB_OUTPUT
            else
              echo "is_tag=false" >> $GITHUB_OUTPUT
              echo "is_dry_run=false" >> $GITHUB_OUTPUT
            fi
          else
            # push to branch or pull_request = always dry-run
            echo "is_tag=false" >> $GITHUB_OUTPUT
            echo "is_dry_run=true" >> $GITHUB_OUTPUT
          fi

  build:
    needs: detect-mode
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x64
            cc: gcc
            archive: tar.gz
          - os: macos-latest
            target: macos-arm64
            cc: clang
            archive: tar.gz
          - os: windows-latest
            target: windows-x64
            cc: msvc
            archive: zip

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Install X11 (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y libx11-dev

      - name: Build all four programs (Linux/macOS)
        if: matrix.cc != 'msvc'
        run: |
          mkdir -p build
          
          # TUI
          ${{ matrix.cc }} -std=c99 -O2 -Wall -Wextra -Wpedantic -Werror src/tui/c99gui.c -o build/c99gui-tui
          
          # Pixel GUI (Cocoa on macOS, X11 on Linux)
          if [ "${{ runner.os }}" = macOS ]; then
            ${{ matrix.cc }} -std=c99 -O2 -Wall -Wextra -Wpedantic -Werror src/pixel/gui.c -framework Cocoa -framework CoreGraphics -o build/c99gui-pixel
            ${{ matrix.cc }} -std=c99 -O2 -Wall -Wextra -Wpedantic -Werror src/vector/gui.c -framework Cocoa -framework CoreGraphics -o build/c99gui-vector
            ${{ matrix.cc }} -std=c99 -O2 -Wall -Wextra -Wpedantic -Werror src/suite/gui.c -framework Cocoa -framework CoreGraphics -o build/c99gui-suite
          else
            ${{ matrix.cc }} -std=c99 -O2 -Wall -Wextra -Wpedantic -Werror src/pixel/gui.c -lX11 -o build/c99gui-pixel
            ${{ matrix.cc }} -std=c99 -O2 -Wall -Wextra -Wpedantic -Werror src/vector/gui.c -lX11 -o build/c99gui-vector
            ${{ matrix.cc }} -std=c99 -O2 -Wall -Wextra -Wpedantic -Werror src/suite/gui.c -lX11 -o build/c99gui-suite
          fi
          
          # Copy LICENSE
          cp LICENSE build/

      - name: Build all four programs (Windows MSVC)
        if: matrix.cc == 'msvc'
        shell: pwsh
        run: |
          # Find Visual Studio installation
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installPath = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $installPath) {
            Write-Error "Visual Studio with C++ tools not found"
            exit 1
          }
          
          # Call vcvarsall.bat to set up environment
          $vcvars = Join-Path $installPath "VC\Auxiliary\Build\vcvarsall.bat"
          cmd.exe /c "call `"$vcvars`" amd64 && set" | ForEach-Object {
            if ($_ -match '^(.*?)=(.*)$') {
              [Environment]::SetEnvironmentVariable($matches[1], $matches[2])
            }
          }
          
          # Verify cl is available
          if (-not (Get-Command cl.exe -ErrorAction SilentlyContinue)) {
            Write-Error "cl.exe not found after running vcvarsall.bat"
            exit 1
          }
          
          # Build
          New-Item -ItemType Directory -Force -Path build | Out-Null
          
          & cl.exe /nologo /std:c11 /W4 /WX /O2 /MT /utf-8 src\tui\c99gui.c /Febuild\c99gui-tui.exe
          & cl.exe /nologo /std:c11 /W4 /WX /O2 /MT /utf-8 src\pixel\gui.c /Febuild\c99gui-pixel.exe
          & cl.exe /nologo /std:c11 /W4 /WX /O2 /MT /utf-8 src\vector\gui.c /Febuild\c99gui-vector.exe
          & cl.exe /nologo /std:c11 /W4 /WX /O2 /MT /utf-8 src\suite\gui.c /Febuild\c99gui-suite.exe
          Copy-Item LICENSE build\

      - name: Sanitize ref name for artifact naming
        shell: bash
        run: |
          # Replace / with - for valid artifact names (NTFS-compatible)
          REF_SAFE=$(echo "${{ github.ref_name }}" | tr '/' '-')
          echo "REF_SAFE=$REF_SAFE" >> $GITHUB_ENV

      - name: Create archive
        shell: bash
        run: |
          cd build
          if [ "${{ matrix.archive }}" = "zip" ]; then
            7z a ../c99gui-${{ env.REF_SAFE }}-${{ matrix.target }}.zip *.exe LICENSE
          else
            tar czvf ../c99gui-${{ env.REF_SAFE }}-${{ matrix.target }}.tar.gz *
          fi
          cd ..
          
          # Generate SHA256 checksums
          if [ "${{ matrix.archive }}" = "zip" ]; then
            sha256sum c99gui-${{ env.REF_SAFE }}-${{ matrix.target }}.zip > SHA256SUMS.txt
          else
            sha256sum c99gui-${{ env.REF_SAFE }}-${{ matrix.target }}.tar.gz > SHA256SUMS.txt
          fi

      - name: Upload artifacts (dry-run or tag)
        if: needs.detect-mode.outputs.is_dry_run == 'true' || needs.detect-mode.outputs.is_tag == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: c99gui-${{ env.REF_SAFE }}-${{ matrix.target }}
          path: |
            c99gui-${{ env.REF_SAFE }}-${{ matrix.target }}.${{ matrix.archive }}
            SHA256SUMS.txt
          retention-days: 7

      - name: Create release notes
        if: needs.detect-mode.outputs.is_tag == 'true'
        run: |
          TAG="${{ github.ref_name }}"
          if grep -q "^## \[$TAG\]" CHANGELOG.md 2>/dev/null; then
            awk -v tag="## \\[$TAG\\]" '
              $0 ~ tag { found=1; next }
              found && /^## \[/ { found=0 }
              found { print }
            ' CHANGELOG.md > RELEASE_NOTES.md
          else
            echo "## Release ${{ github.ref_name }}" > RELEASE_NOTES.md
            echo "" >> RELEASE_NOTES.md
            echo "Automated release build with all four c99gui programs:" >> RELEASE_NOTES.md
            echo "- c99gui-tui: Terminal UI (zero dependencies)" >> RELEASE_NOTES.md
            echo "- c99gui-pixel: Pixel desktop GUI" >> RELEASE_NOTES.md
            echo "- c99gui-vector: Vector desktop GUI" >> RELEASE_NOTES.md
            echo "- c99gui-suite: Comprehensive vector GUI suite" >> RELEASE_NOTES.md
          fi

      - name: Upload release assets
        if: needs.detect-mode.outputs.is_tag == 'true'
        uses: softprops/action-gh-release@v3
        with:
          files: |
            c99gui-${{ env.REF_SAFE }}-${{ matrix.target }}.${{ matrix.archive }}
            SHA256SUMS.txt
          body_path: RELEASE_NOTES.md
          fail_on_unmatched_files: true
