name: release

on:
  push:
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      mode:
        description: 'Mode: dry-run (upload only) or publish-test (test publish prep)'
        required: false
        default: 'dry-run'
        type: choice
        options:
          - dry-run
          - publish-test
      version:
        description: 'Version for notes extraction (e.g., 2.1.0)'
        required: false
        type: string

jobs:
  # Determine if this is a real release (tag push) or dry-run
  detect-mode:
    runs-on: ubuntu-latest
    outputs:
      is_tag: ${{ steps.check.outputs.is_tag }}
      is_dry_run: ${{ steps.check.outputs.is_dry_run }}
      is_publish_test: ${{ steps.check.outputs.is_publish_test }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - id: check
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${{ github.ref_name }}"
            VER="${TAG#v}"  # Strip leading 'v'
            echo "is_tag=true" >> $GITHUB_OUTPUT
            echo "is_dry_run=false" >> $GITHUB_OUTPUT
            echo "is_publish_test=false" >> $GITHUB_OUTPUT
            echo "version=$VER" >> $GITHUB_OUTPUT
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            MODE="${{ github.event.inputs.mode }}"
            VER="${{ github.event.inputs.version }}"
            if [[ -z "$VER" ]]; then
              VER="${{ github.ref_name }}"
              VER="${VER#v}"
            fi
            echo "version=$VER" >> $GITHUB_OUTPUT
            if [[ "$MODE" == "publish-test" ]]; then
              echo "is_tag=false" >> $GITHUB_OUTPUT
              echo "is_dry_run=false" >> $GITHUB_OUTPUT
              echo "is_publish_test=true" >> $GITHUB_OUTPUT
            else
              # dry-run (default)
              echo "is_tag=false" >> $GITHUB_OUTPUT
              echo "is_dry_run=true" >> $GITHUB_OUTPUT
              echo "is_publish_test=false" >> $GITHUB_OUTPUT
            fi
          else
            # pull_request = always dry-run
            echo "is_tag=false" >> $GITHUB_OUTPUT
            echo "is_dry_run=true" >> $GITHUB_OUTPUT
            echo "is_publish_test=false" >> $GITHUB_OUTPUT
            echo "version=UNRELEASED" >> $GITHUB_OUTPUT
          fi

  # Linux: fully static binaries (musl libc, X11 linked statically) built in Alpine, then
  # smoke-tested on the runner's own Ubuntu (glibc) to prove they run on a foreign distribution.
  build-linux:
    needs: detect-mode
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: linux-x64
          - runner: ubuntu-24.04-arm
            target: linux-arm64
    runs-on: ${{ matrix.runner }}
    env:
      PKG: c99gui-${{ needs.detect-mode.outputs.version }}-${{ matrix.target }}
    steps:
      - uses: actions/checkout@v7

      - name: Build static binaries in Alpine
        run: docker run --rm -v "$PWD":/src -w /src alpine:3.22 sh scripts/build-static-linux.sh build

      - name: Smoke tests on the host distribution
        run: |
          sudo chown -R "$(id -u):$(id -g)" build
          file build/c99gui-*
          sh tests/tui_smoke.sh build/c99gui-tui
          for p in pixel vector suite; do sh tests/smoke.sh build/c99gui-$p; done

      - name: Package
        run: |
          mkdir "$PKG"
          cp build/c99gui-tui build/c99gui-pixel build/c99gui-vector build/c99gui-suite LICENSE README.md "$PKG/"
          tar czf "$PKG.tar.gz" "$PKG"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.PKG }}
          path: ${{ env.PKG }}.tar.gz
          retention-days: 7

  # macOS: one universal binary per program (arm64 + x86_64), linked only against system frameworks.
  build-macos:
    needs: detect-mode
    runs-on: macos-latest
    env:
      PKG: c99gui-${{ needs.detect-mode.outputs.version }}-macos-universal
    steps:
      - uses: actions/checkout@v7

      - name: Build universal binaries
        run: |
          mkdir -p build
          FLAGS="-std=c99 -O2 -Wall -Wextra -Wpedantic -Wconversion -Wshadow -Werror -arch arm64 -arch x86_64 -mmacosx-version-min=11.0"
          clang $FLAGS src/tui/c99gui.c -o build/c99gui-tui
          for p in pixel vector suite; do
            clang $FLAGS src/$p/gui.c -framework Cocoa -framework CoreGraphics -o build/c99gui-$p
          done

      - name: Check architectures and dependencies
        run: |
          status=0
          for b in build/c99gui-*; do
            archs=$(lipo -archs "$b"); echo "$b: $archs"
            case "$archs" in *x86_64*arm64*|*arm64*x86_64*) ;; *) echo "NOT UNIVERSAL: $b"; status=1 ;; esac
            # A universal binary prints one "(architecture ...)" header per slice; dependencies are the indented lines
            deps=$(otool -L "$b" | grep -E '^[[:space:]]' || true)
            echo "$deps"
            if echo "$deps" | grep -vE '^[[:space:]]+(/System/Library/|/usr/lib/)'; then echo "NON-SYSTEM DEPENDENCY: $b"; status=1; fi
          done
          exit $status

      - name: Smoke tests (arm64 slice)
        run: |
          sh tests/tui_smoke.sh build/c99gui-tui
          for p in pixel vector suite; do sh tests/smoke.sh build/c99gui-$p; done

      - name: Test the x86_64 slice under Rosetta
        run: |
          if arch -x86_64 /usr/bin/true 2>/dev/null; then
            for p in pixel vector suite; do arch -x86_64 build/c99gui-$p --test | tail -1; done
          else
            echo "::warning::Rosetta is not available on this runner; the x86_64 slice was built and checked with lipo but not executed"
          fi

      - name: Package
        run: |
          mkdir "$PKG"
          cp build/c99gui-tui build/c99gui-pixel build/c99gui-vector build/c99gui-suite LICENSE README.md "$PKG/"
          tar czf "$PKG.tar.gz" "$PKG"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.PKG }}
          path: ${{ env.PKG }}.tar.gz
          retention-days: 7

  # Windows: MSVC with the static CRT (/MT), so the executables need only system DLLs.
  build-windows:
    needs: detect-mode
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            target: windows-x64
            vcvars: amd64
            vctools: Microsoft.VisualStudio.Component.VC.Tools.x86.x64
          - runner: windows-latest
            target: windows-x86
            vcvars: x86
            vctools: Microsoft.VisualStudio.Component.VC.Tools.x86.x64
          - runner: windows-11-arm
            target: windows-arm64
            vcvars: arm64
            vctools: Microsoft.VisualStudio.Component.VC.Tools.ARM64
    runs-on: ${{ matrix.runner }}
    env:
      PKG: c99gui-${{ needs.detect-mode.outputs.version }}-${{ matrix.target }}
    steps:
      - uses: actions/checkout@v7

      - name: Build with MSVC
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installPath = & $vswhere -latest -products * -requires ${{ matrix.vctools }} -property installationPath
          if (-not $installPath) { Write-Error "Visual Studio with ${{ matrix.vctools }} not found"; exit 1 }
          $vcvars = Join-Path $installPath "VC\Auxiliary\Build\vcvarsall.bat"
          cmd.exe /c "call `"$vcvars`" ${{ matrix.vcvars }} && set" | ForEach-Object {
            if ($_ -match '^(.*?)=(.*)$') { [Environment]::SetEnvironmentVariable($matches[1], $matches[2]) }
          }
          if (-not (Get-Command cl.exe -ErrorAction SilentlyContinue)) { Write-Error "cl.exe not found"; exit 1 }
          New-Item -ItemType Directory -Force -Path build | Out-Null
          $srcs = [ordered]@{ tui = 'src\tui\c99gui.c'; pixel = 'src\pixel\gui.c'; vector = 'src\vector\gui.c'; suite = 'src\suite\gui.c' }
          foreach ($k in $srcs.Keys) {
            & cl.exe /nologo /std:c11 /W4 /WX /O2 /MT /utf-8 $srcs[$k] /Fobuild\ /Febuild\c99gui-$k.exe
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          # Static CRT: no VC runtime or UCRT DLLs may appear among the dependencies
          $bad = 0
          foreach ($k in $srcs.Keys) {
            $deps = & dumpbin /nologo /dependents "build\c99gui-$k.exe" | Where-Object { $_ -match '\.dll\s*$' } | ForEach-Object { $_.Trim() }
            Write-Output "c99gui-$k.exe: $($deps -join ', ')"
            if ($deps | Where-Object { $_ -match '^(vcruntime|msvcp|ucrtbase|api-ms-win-crt)' }) { Write-Output "NON-STATIC CRT: c99gui-$k.exe"; $bad = 1 }
          }
          exit $bad

      - name: Smoke tests
        shell: bash
        run: |
          sh tests/tui_smoke.sh build/c99gui-tui.exe
          for p in pixel vector suite; do sh tests/smoke.sh build/c99gui-$p.exe; done

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path $env:PKG | Out-Null
          Copy-Item build\c99gui-tui.exe, build\c99gui-pixel.exe, build\c99gui-vector.exe, build\c99gui-suite.exe, LICENSE, README.md -Destination $env:PKG
          Compress-Archive -Path $env:PKG -DestinationPath "$env:PKG.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.PKG }}
          path: ${{ env.PKG }}.zip
          retention-days: 7

  # Publish job: downloads all artifacts, creates combined SHA256SUMS, creates release (or shows dry-run summary)
  publish:
    needs: [detect-mode, build-linux, build-macos, build-windows]
    if: needs.detect-mode.outputs.is_tag == 'true' || needs.detect-mode.outputs.is_publish_test == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      
      - name: Sanitize ref name
        run: |
          REF_SAFE=$(echo "${{ github.ref_name }}" | tr '/' '-')
          echo "REF_SAFE=$REF_SAFE" >> $GITHUB_ENV
      
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: c99gui-*
          merge-multiple: true
          path: ./release-artifacts

      - name: List downloaded artifacts
        shell: bash
        run: |
          echo "Downloaded artifacts:"
          ls -la ./release-artifacts/ || echo "Directory not found"
          pwd

      - name: Extract release notes
        id: extract-notes
        shell: bash
        run: |
          bash scripts/extract-notes.sh "${{ needs.detect-mode.outputs.version }}" RELEASE_NOTES.md
          cat RELEASE_NOTES.md

      - name: Create SHA256SUMS
        shell: bash
        run: |
          ls -la ./release-artifacts/
          cd ./release-artifacts
          # Find all archives and create combined checksums
          > ../SHA256SUMS.txt
          for archive in *.tar.gz *.zip; do
            if [ -f "$archive" ]; then
              sha256sum "$archive" >> ../SHA256SUMS.txt
            fi
          done
          cd ..
          # Verify all checksums
          cd ./release-artifacts
          sha256sum -c ../SHA256SUMS.txt
          cd ..

      - name: Create release (real)
        if: needs.detect-mode.outputs.is_tag == 'true'
        uses: softprops/action-gh-release@v3
        with:
          files: |
            release-artifacts/*.tar.gz
            release-artifacts/*.zip
            SHA256SUMS.txt
          body_path: RELEASE_NOTES.md
          fail_on_unmatched_files: true

      - name: Show publish-test summary
        if: needs.detect-mode.outputs.is_publish_test == 'true'
        shell: bash
        run: |
          echo "=== PUBLISH-TEST SUMMARY ==="
          echo 'Version: ${{ needs.detect-mode.outputs.version }}'
          echo "Release notes:"
          cat RELEASE_NOTES.md
          echo ""
          echo "Artifacts:"
          ls -la release-artifacts/
          echo "SHA256SUMS:"
          cat SHA256SUMS.txt
          echo ""
          echo "Publish preparation successful. To create real release, push a tag:"
          echo '  git tag v${{ needs.detect-mode.outputs.version }} && git push origin v${{ needs.detect-mode.outputs.version }}'

      - name: "Negative check: 9.9.9 should not have notes"
        if: "needs.detect-mode.outputs.is_publish_test == 'true'"
        shell: bash
        run: |
          echo "=== NEGATIVE CHECK: 9.9.9 (should fail) ==="
          if bash scripts/extract-notes.sh 9.9.9 /tmp/notes_999.md 2>/dev/null; then
            echo "ERROR: Extraction produced non-empty notes for non-existent 9.9.9" >&2
            cat /tmp/notes_999.md
            exit 1
          fi
          echo "PASS: 9.9.9 correctly has no changelog section"

      - name: Show dry-run summary
        if: needs.detect-mode.outputs.is_dry_run == 'true'
        shell: bash
        run: |
          echo "=== DRY-RUN SUMMARY ==="
          echo 'Version: ${{ needs.detect-mode.outputs.version }}'
          echo "Artifacts uploaded (no release created)"
          echo "To test publish preparation, use mode: publish-test"
          echo "To create real release, push a tag v*"