name: ci
on: [push, pull_request]

jobs:
  posix:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        cc: [gcc, clang]
        mode: [default, headless]
        exclude:
          - { os: macos-latest, cc: gcc }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install X11 (Linux)
        if: runner.os == 'Linux' && matrix.mode == 'default'
        run: sudo apt-get update && sudo apt-get install -y libx11-dev
      - name: Build
        run: |
          mkdir -p build
          flags=""
          [ "${{ matrix.mode }}" = headless ] && flags="-DC99GUI_HEADLESS"
          if [ "${{ runner.os }}" = macOS ]; then
            flags="$flags -framework Cocoa -framework CoreGraphics"
          elif [ "${{ matrix.mode }}" = default ]; then
            flags="$flags -lX11"
          fi
          ${{ matrix.cc }} -std=c99 -O2 -Wall -Wextra -Wpedantic -Wconversion -Wshadow \
            -Werror $flags src/gui.c -o build/gui
      - name: Test
        run: sh tests/smoke.sh build/gui

  windows-msvc:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Build
        shell: cmd
        run: build.cmd
      - name: Test
        shell: bash
        run: sh tests/smoke.sh build/gui.exe

  windows-msys2:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          install: mingw-w64-ucrt-x86_64-gcc
      - name: Build and test
        run: |
          mkdir -p build
          gcc -std=c99 -O2 -Wall -Wextra -Wpedantic -Wconversion -Wshadow -Werror \
            src/gui.c -lgdi32 -luser32 -o build/gui.exe
          sh tests/smoke.sh build/gui.exe
